spring.application.name=slotify-backend
slotify.time-zone=${SLOTIFY_TIME_ZONE:Europe/Berlin}

spring.datasource.url=jdbc:postgresql://localhost:5432/slotify
spring.datasource.username=diyarburak
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

slotify.frontend-url=${SLOTIFY_FRONTEND_URL:http://localhost:5173}
slotify.mail-from=${SMTP_FROM:no-reply@slotify.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
logging.level.org.hibernate.orm.jdbc.bind=OFF
server.tomcat.accesslog.enabled=false
