# Only activate explicitly with SPRING_PROFILES_ACTIVE=demo.
# Required: never fall back to the local development database.
spring.datasource.url=${SLOTIFY_DEMO_DB_URL}
spring.datasource.username=${SLOTIFY_DEMO_DB_USERNAME}
spring.datasource.password=${SLOTIFY_DEMO_DB_PASSWORD}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
slotify.registration-enabled=false
